# GoReleaser configuration for rev.
# Docs: https://goreleaser.com
version: 2

project_name: rev

before:
  hooks:
    - go mod tidy

builds:
  - id: rev
    main: ./cmd/bootstrap
    binary: rev
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: rev
    ids:
      - rev
    # Deterministic names consumed by install.sh:
    #   rev_<version>_<os>_<arch>.{tar.gz,zip}
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "merge conflict"
      - "Merge pull request"
      - "Merge branch"

release:
  draft: false
  prerelease: auto
